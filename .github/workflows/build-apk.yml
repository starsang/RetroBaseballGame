name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' }
          
          android {
              namespace 'com.example.retrobaseball'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.retrobaseball'
                  minSdk 24
                  targetSdk 35
                  versionCode 9
                  versionName '9.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                              'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'EOF_FILE'

          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:theme="@style/AppTheme" android:label="16BIT BASEBALL" android:allowBackup="false">
                  <activity android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/BaseballView.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/BaseballView.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          
          import android.content.Context;
          import android.graphics.*;
          import com.example.retrobaseball.R;
          import android.os.*;
          import android.view.*;
          import java.util.Random;
          
          public class BaseballView extends View {
              final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG), q=new Paint();
              final Random rnd=new Random();
          
              Bitmap batterBack0,batterBack1,batterBack2,batterBack3,batterFront;
              Bitmap pitcherFront0,pitcherFront1,pitcherFront2,pitcherFront3;
              Bitmap pitcherBack0,pitcherBack1,pitcherBack2,pitcherBack3;
              final String me, opp;
              final Vibrator vib;
          
              int W,H; float S; int ox,oy;
              final int VW=900, VH=1200;
              boolean batting=true, gameOver=false;
              int phase=0; // 0 ready, 1 windup, 2 flight, 3 result, 4 pitch setup
              int pitch=0, aim=4;
              float t=0, swing=0, result=0, flash=0;
              int inning=1, outs=0, strikes=0, meRuns=0, oppRuns=0;
              String msg="READY", resultMsg="";
          
              final int GRASS=Color.rgb(35,151,52), GRASS2=Color.rgb(44,164,59);
              final int DIRT=Color.rgb(151,91,21), DARK=Color.rgb(7,14,28);
              final int WHITE=Color.WHITE, YELLOW=Color.rgb(255,218,60);
              final int HOME=Color.rgb(206,54,39), AWAY=Color.rgb(36,76,175);
          
              BaseballView(Context c,String m,String o){
                  super(c); me=m; opp=o;
                  batterBack0=load(R.drawable.batter_back_0);
                  batterBack1=load(R.drawable.batter_back_1);
                  batterBack2=load(R.drawable.batter_back_2);
                  batterBack3=load(R.drawable.batter_back_3);
                  batterFront=load(R.drawable.batter_front_0);
                  pitcherFront0=load(R.drawable.pitcher_front_0);
                  pitcherFront1=load(R.drawable.pitcher_front_1);
                  pitcherFront2=load(R.drawable.pitcher_front_2);
                  pitcherFront3=load(R.drawable.pitcher_front_3);
                  pitcherBack0=load(R.drawable.pitcher_back_0);
                  pitcherBack1=load(R.drawable.pitcher_back_1);
                  pitcherBack2=load(R.drawable.pitcher_back_2);
                  pitcherBack3=load(R.drawable.pitcher_back_3);
                  if(Build.VERSION.SDK_INT>=31){
                      VibratorManager vm=(VibratorManager)c.getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                      vib=vm.getDefaultVibrator();
                  }else vib=(Vibrator)c.getSystemService(Context.VIBRATOR_SERVICE);
              }
          
              @Override protected void onDraw(Canvas c){
                  W=getWidth(); H=getHeight();
                  int vw=Math.min(W,(int)(H*.75f)), vh=(int)(vw/.75f);
                  if(vh>H){vh=H;vw=(int)(H*.75f);}
                  S=vw/(float)VW; ox=(W-vw)/2; oy=(H-vh)/2;
                  c.drawColor(Color.BLACK);
                  c.save(); c.translate(ox,oy); c.scale(S,S);
          
                  drawStadium(c);
                  if(batting) drawBatterCamera(c); else drawPitcherCamera(c);
                  drawPlayers(c);
                  if(phase==1) drawWindup(c);
                  if(phase==2) drawBall(c);
                  if(flash>0) drawImpact(c);
                  drawHUD(c);
                  if(gameOver) drawGameOver(c);
          
                  c.restore();
                  tick();
                  postInvalidateDelayed(16);
              }
          
              void tick(){
                  if(phase==1){
                      t+=.035f;
                      if(t>=1){t=0;phase=2;msg="BALL COMING!";}
                  }else if(phase==2){
                      t+=.014f;
                      if(t>=1){
                          t=1;
                          if(batting){phase=3;result=.75f;msg="SWING NOW!";}
                          else cpuResult();
                      }
                  }
                  if(swing>0){swing+=.11f;if(swing>=1)swing=0;}
                  if(result>0){result-=.035f;if(result<=0){result=0;advance();}}
                  if(flash>0)flash-=.12f;
              }
          
              void drawStadium(Canvas c){
                  rect(c,DARK,0,0,900,86);
                  stroke(c,WHITE,8,8,892,78,3);
                  text(c,opp+" "+oppRuns,24,39,20,WHITE);
                  text(c,me+" "+meRuns,760-p.measureText(me+" "+meRuns),39,20,WHITE);
                  text(c,inning+"회 "+(batting?"초":"말"),415,35,18,YELLOW);
                  text(c,"B 0   S "+strikes+"   O "+outs,390,62,13,WHITE);
          
                  rect(c,Color.rgb(31,70,49),0,90,900,245);
                  for(int y=100;y<220;y+=20) for(int x=0;x<900;x+=22){
                      int n=(x/22+y/20)%5;
                      int col=n==0?Color.rgb(230,183,54):n==1?Color.rgb(54,93,190):
                              n==2?Color.rgb(210,50,45):n==3?Color.WHITE:Color.rgb(225,135,170);
                      rect(c,col,x+3,y,x+15,y+9);
                  }
                  rect(c,Color.rgb(12,101,54),0,220,900,252);
                  text(c,batting?"BATTER VIEW":"PITCHER VIEW",365,242,14,YELLOW);
              }
          
              // Camera looking from behind the batter toward center field.
              void drawBatterCamera(Canvas c){
                  drawGrass(c);
                  // Outfield wall and distance marker.
                  rect(c,Color.rgb(18,100,53),0,252,900,292);
                  text(c,"125m",423,278,15,Color.rgb(10,73,42));
          
                  // Home plate bottom, second base top: normal baseball orientation.
                  Path in=new Path();
                  in.moveTo(450,1070); in.lineTo(285,675); in.lineTo(450,390); in.lineTo(615,675); in.close();
                  q.setColor(DIRT); c.drawPath(in,q);
                  base(c,450,1070); base(c,285,675); base(c,450,390); base(c,615,675);
                  q.setColor(DIRT); c.drawOval(365,445,535,510,q);
                  rect(c,WHITE,425,474,475,483);
          
                  foul(c,345,1050,0,320); foul(c,555,1050,900,320);
          
                  // batter's boxes
                  stroke(c,WHITE,260,940,375,1085,4);
                  stroke(c,WHITE,525,940,640,1085,4);
              }
          
              // Camera is turned 180 degrees: batter is at 12 o'clock, pitcher at bottom.
              void drawPitcherCamera(Canvas c){
                  drawGrass(c);
                  rect(c,Color.rgb(18,100,53),0,252,900,292);
                  text(c,"125m",423,278,15,Color.rgb(10,73,42));
          
                  // Reversed map: home plate is at top, second base bottom.
                  Path in=new Path();
                  in.moveTo(450,390); in.lineTo(615,675); in.lineTo(450,1070); in.lineTo(285,675); in.close();
                  q.setColor(DIRT); c.drawPath(in,q);
                  base(c,450,390); base(c,615,675); base(c,450,1070); base(c,285,675);
                  q.setColor(DIRT); c.drawOval(365,950,535,1015,q);
                  rect(c,WHITE,425,970,475,979);
          
                  foul(c,345,350,0,1040); foul(c,555,350,900,1040);
          
                  // Batter boxes at the top, now viewed from pitcher side.
                  stroke(c,WHITE,260,300,375,445,4);
                  stroke(c,WHITE,525,300,640,445,4);
              }
          
              void drawGrass(Canvas c){
                  rect(c,GRASS,0,252,900,1200);
                  for(int y=270;y<1200;y+=38) rect(c,GRASS2,0,y,900,y+15);
                  // Pixel mowing texture.
                  for(int y=260;y<1180;y+=26) for(int x=(y%52);x<900;x+=52)
                      rect(c,Color.argb(32,0,80,20),x,y,x+18,y+4);
              }
          
              void drawPlayers(Canvas c){
                  if(batting){
                      // Detailed pitcher front at 12 o'clock, batter back at bottom.
                      drawSprite(c, pitcherFront(), 450, 475, 1.45f);
                      drawSprite(c, batterBack(), 450, 900, 1.72f);
                  }else{
                      // Camera is reversed: detailed batter front at 12 o'clock,
                      // player-controlled pitcher is shown from behind at the bottom.
                      drawSprite(c, batterFront, 450, 420, 1.55f);
                      drawSprite(c, pitcherBack(), 450, 900, 1.72f);
                  }
              }
          
              Bitmap load(int id){ return BitmapFactory.decodeResource(getResources(), id); }
          
              Bitmap batterBack(){
                  if(swing<=0) return batterBack0;
                  if(swing<.33f) return batterBack1;
                  if(swing<.68f) return batterBack2;
                  return batterBack3;
              }
          
              Bitmap pitcherFront(){
                  if(phase!=1) return pitcherFront0;
                  if(t<.30f) return pitcherFront1;
                  if(t<.68f) return pitcherFront2;
                  return pitcherFront3;
              }
          
              Bitmap pitcherBack(){
                  if(phase!=1) return pitcherBack0;
                  if(t<.30f) return pitcherBack1;
                  if(t<.68f) return pitcherBack2;
                  return pitcherBack3;
              }
          
              void drawSprite(Canvas c, Bitmap b, float cx, float cy, float scale){
                  if(b==null)return;
                  float w=b.getWidth()*scale, h=b.getHeight()*scale;
                  RectF dst=new RectF(cx-w/2f,cy-h/2f,cx+w/2f,cy+h/2f);
                  Paint sp=new Paint(Paint.FILTER_BITMAP_FLAG);
                  sp.setFilterBitmap(false); // preserve hard 16-bit pixels
                  c.drawBitmap(b,null,dst,sp);
              }
          
              void drawWindup(Canvas c){
                  rect(c,Color.argb(220,0,0,0),145,510,755,640);
                  stroke(c,YELLOW,145,510,755,640,4);
                  String s=batting?"PITCHER WIND UP":"YOUR PITCH";
                  text(c,s,450-p.measureText(s)/2,555,29,YELLOW);
                  rect(c,Color.DKGRAY,205,580,695,599);
                  rect(c,YELLOW,205,580,205+490*t,599);
                  text(c,"준비 → 다리 들기 → 투구",330,623,13,WHITE);
              }
          
              void drawBall(Canvas c){
                  float e=1-(float)Math.pow(1-t,1.55f);
                  float sx=450, sy=batting?515:870;
                  float ey=batting?880:455;
                  float ex=450+(aim%3-1)*62;
                  float curve=pitch==1?55:pitch==2?-42:7;
                  float x=sx+(ex-sx)*e+(float)Math.sin(e*Math.PI)*curve;
                  float y=sy+(ey-sy)*e;
          
                  // Strong visual trajectory.
                  q.setColor(Color.argb(100,255,255,255));q.setStrokeWidth(5);
                  Path path=new Path();path.moveTo(sx,sy);path.quadTo(450+curve,(sy+ey)/2,ex,ey);c.drawPath(path,q);
          
                  for(int i=10;i>=1;i--){
                      float tt=Math.max(0,t-i*.022f);
                      float ee=1-(float)Math.pow(1-tt,1.55f);
                      float tx=sx+(ex-sx)*ee+(float)Math.sin(ee*Math.PI)*curve;
                      float ty=sy+(ey-sy)*ee;
                      q.setColor(Color.argb(12*(11-i),255,255,255));
                      c.drawCircle(tx,ty,6+8*ee,q);
                  }
          
                  float r=7+18*e;
                  q.setColor(WHITE);c.drawCircle(x,y,r,q);
                  q.setColor(Color.rgb(220,30,30));q.setStrokeWidth(2);
                  c.drawArc(x-r*.55f,y-r*.55f,x+r*.55f,y+r*.55f,25,75,false,q);
                  c.drawArc(x-r*.55f,y-r*.55f,x+r*.55f,y+r*.55f,205,75,false,q);
          
                  q.setColor(Color.argb(190,255,218,60));q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(4);
                  c.drawCircle(ex,ey,36,q);q.setStyle(Paint.Style.FILL);
                  text(c,"BALL",x-18,y-27,11,WHITE);
              }
          
              void drawImpact(Canvas c){
                  rect(c,Color.argb((int)(100*flash),255,242,120),0,0,900,1200);
                  text(c,"CRACK!",450-p.measureText("CRACK!")/2,600,42,YELLOW);
                  for(int i=0;i<8;i++){
                      double a=i*Math.PI/4;
                      float x=(float)(450+Math.cos(a)*120*flash);
                      float y=(float)(620+Math.sin(a)*120*flash);
                      rect(c,YELLOW,x-5,y-5,x+5,y+5);
                  }
              }
          
              void drawHUD(Canvas c){
                  float top=1015;
                  rect(c,Color.argb(242,2,7,12),12,top,888,1188);
                  stroke(c,YELLOW,12,top,888,1188,4);
                  String role=batting?"YOUR TURN — BATTER":"YOUR TURN — PITCHER";
                  text(c,role,450-p.measureText(role)/2,top+32,19,YELLOW);
                  text(c,msg,450-p.measureText(msg)/2,top+58,13,WHITE);
          
                  if(batting){
                      button(c,315,top+75,585,top+135,"SWING",YELLOW);
                      text(c,"노란 링에 공이 들어오는 순간!",330,top+160,11,WHITE);
                  }else if(phase==4){
                      text(c,"구종",25,top+82,12,WHITE);
                      button(c,20,top+96,120,top+137,"FAST",pitch==0?YELLOW:WHITE);
                      button(c,130,top+96,240,top+137,"CURVE",pitch==1?YELLOW:WHITE);
                      button(c,250,top+96,360,top+137,"SLIDER",pitch==2?YELLOW:WHITE);
                      text(c,"방향",530,top+82,12,WHITE);
                      String[] a={"↖","↑","↗","←","●","→","↙","↓","↘"};
                      float gx=510,gy=top+91,bs=25;
                      for(int i=0;i<9;i++){
                          int row=i/3,col=i%3;
                          button(c,gx+col*29,gy+row*29,gx+col*29+bs,gy+row*29+bs,a[i],aim==i?YELLOW:WHITE);
                      }
                      button(c,745,top+96,865,top+137,"THROW",YELLOW);
                  }else{
                      button(c,315,top+75,585,top+135,"PITCH",YELLOW);
                      text(c,"구종 선택 → 9방향 → THROW",330,top+160,11,WHITE);
                  }
              }
          
              void drawGameOver(Canvas c){
                  rect(c,Color.argb(238,0,0,0),0,0,900,1200);
                  text(c,"GAME OVER",450-p.measureText("GAME OVER")/2,530,34,YELLOW);
                  String w=meRuns==oppRuns?"DRAW GAME":meRuns>oppRuns?me+" WIN!":opp+" WIN!";
                  text(c,w,450-p.measureText(w)/2,585,25,WHITE);
                  text(c,opp+" "+oppRuns+"  -  "+meRuns+" "+me,450-120,625,17,WHITE);
                  button(c,330,675,570,740,"RESTART",YELLOW);
              }
          
              void startCpuPitch(){
                  if(!batting||phase!=0||gameOver)return;
                  pitch=rnd.nextInt(3);aim=rnd.nextInt(9);
                  phase=1;t=0;msg="PITCHER WIND UP!";
              }
          
              void openPitch(){
                  if(batting||phase!=0||gameOver)return;
                  phase=4;msg="SELECT PITCH";
              }
          
              void throwBall(){
                  if(batting||phase!=4||gameOver)return;
                  phase=1;t=0;msg="YOUR WIND UP!";
              }
          
              void swing(){
                  if(!batting||phase!=2)return;
                  swing=.01f;
                  if(t>=.56f&&t<=.88f){
                      int r=rnd.nextInt(100);
                      if(r<10){meRuns+=4;resultMsg="HOME RUN!";}
                      else if(r<32){meRuns+=2;resultMsg="DOUBLE!";}
                      else if(r<74){meRuns++;resultMsg="BASE HIT!";}
                      else{outs++;resultMsg="OUT!";}
                      flash=1;hitVibration();
                  }else{
                      strikes++;
                      resultMsg=t<.56f?"TOO EARLY!":"TOO LATE!";
                  }
                  phase=3;result=.75f;msg=resultMsg;
              }
          
              void cpuResult(){
                  int r=rnd.nextInt(100);
                  if(r<14){oppRuns++;resultMsg="HIT!";}else{outs++;resultMsg="OUT!";}
                  phase=3;result=.75f;msg=resultMsg;
              }
          
              void advance(){
                  if(strikes>=3){strikes=0;outs++;msg="STRIKEOUT!";}
                  if(outs>=3){
                      outs=0;strikes=0;batting=!batting;
                      if(batting)inning++;
                      phase=0;msg=batting?me+" AT BAT":opp+" AT BAT";
                      if(inning>9&&meRuns!=oppRuns)gameOver=true;
                      if(inning>12)gameOver=true;
                  }else{
                      phase=0;msg=batting?"READY FOR PITCH":"SELECT PITCH";
                  }
              }
          
              void hitVibration(){
                  try{
                      if(vib==null||!vib.hasVibrator())return;
                      if(Build.VERSION.SDK_INT>=26)vib.vibrate(VibrationEffect.createOneShot(65,VibrationEffect.DEFAULT_AMPLITUDE));
                      else vib.vibrate(65);
                  }catch(Exception ignored){}
              }
          
              @Override public boolean onTouchEvent(MotionEvent e){
                  if(e.getAction()!=MotionEvent.ACTION_UP)return true;
                  float x=(e.getX()-ox)/S,y=(e.getY()-oy)/S;
                  if(x<0||y<0||x>VW||y>VH)return true;
          
                  if(gameOver){
                      if(x>315&&x<585&&y>650&&y<760)((MainActivity)getContext()).restart();
                      return true;
                  }
          
                  if(batting){
                      if(phase==0&&y>1010){startCpuPitch();}
                      else if(phase==2&&y>1010){swing();}
                  }else{
                      if(phase==0&&y>1010){openPitch();return true;}
                      if(phase==4){
                          if(y>1110){
                              if(x<120)pitch=0;
                              else if(x<240)pitch=1;
                              else if(x<360)pitch=2;
                              else if(x>735){throwBall();return true;}
                          }
                          float gx=510,gy=1105,bs=25;
                          for(int i=0;i<9;i++){
                              int row=i/3,col=i%3;float l=gx+col*29,t0=gy+row*29;
                              if(x>=l&&x<=l+bs&&y>=t0&&y<=t0+bs){aim=i;msg="AIM "+(i+1);return true;}
                          }
                      }
                  }
                  return true;
              }
          
              void foul(Canvas c,float x1,float y1,float x2,float y2){
                  q.setColor(WHITE);q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(5);
                  c.drawLine(x1,y1,x2,y2,q);q.setStyle(Paint.Style.FILL);
              }
              void base(Canvas c,float x,float y){
                  Path b=new Path();b.moveTo(x,y-12);b.lineTo(x+12,y);b.lineTo(x,y+12);b.lineTo(x-12,y);b.close();
                  q.setColor(WHITE);c.drawPath(b,q);
              }
              void rect(Canvas c,int col,float l,float t,float r,float b){q.setColor(col);c.drawRect(l,t,r,b,q);}
              void stroke(Canvas c,int col,float l,float t,float r,float b,float sw){
                  q.setColor(col);q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(sw);c.drawRect(l,t,r,b,q);q.setStyle(Paint.Style.FILL);
              }
              void text(Canvas c,String s,float x,float y,float size,int col){
                  p.setTypeface(Typeface.create(Typeface.MONOSPACE,Typeface.BOLD));
                  p.setTextSize(size);p.setColor(col);c.drawText(s,x,y,p);
              }
              void button(Canvas c,float l,float t,float r,float b,String s,int col){
                  rect(c,Color.rgb(7,11,17),l,t,r,b);stroke(c,col,l,t,r,b,3);
                  p.setTextSize(15);text(c,s,(l+r-p.measureText(s))/2,(t+b)/2+6,15,col);
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/MainActivity.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/MainActivity.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          
          import android.app.*;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  setup();
              }
              private void setup() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(35, 10, 35, 4);
                  box.setBackgroundColor(Color.rgb(10,14,20));
          
                  TextView t = new TextView(this);
                  t.setText("16BIT BASEBALL\nARCADE EDITION");
                  t.setTextColor(Color.WHITE); t.setTextSize(21); t.setGravity(Gravity.CENTER);
                  box.addView(t);
          
                  EditText home = new EditText(this);
                  home.setText("RED SOX"); home.setHint("내 팀");
                  home.setTextColor(Color.WHITE); home.setHintTextColor(Color.GRAY);
                  box.addView(home);
          
                  EditText away = new EditText(this);
                  away.setText("BLUE STARS"); away.setHint("상대 팀");
                  away.setTextColor(Color.WHITE); away.setHintTextColor(Color.GRAY);
                  box.addView(away);
          
                  new AlertDialog.Builder(this).setView(box)
                      .setPositiveButton("PLAY BALL", (d,w) -> {
                          String a=home.getText().toString().trim();
                          String e=away.getText().toString().trim();
                          if(a.isEmpty()) a="HOME"; if(e.isEmpty()) e="AWAY";
                          setContentView(new BaseballView(this,a,e));
                      }).setCancelable(false).show();
              }
              public void restart() { setup(); }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
          <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">monospace</item>
              <item name="android:windowFullscreen">true</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowLightNavigationBar">false</item>
          </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RetroBaseballGame"
          include(":app")
          EOF_FILE
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroBaseball-v9-debug
          path: app/build/outputs/apk/debug/app-debug.apk
