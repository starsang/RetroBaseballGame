name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          echo  | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          echo  | base64 -d > 'app/proguard-rules.pro'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo  | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/BaseballView.java')"
          echo  | base64 -d > 'app/src/main/java/com/example/retrobaseball/BaseballView.java'
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/MainActivity.java')"
          echo  | base64 -d > 'app/src/main/java/com/example/retrobaseball/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo  | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'build.gradle')"
          echo cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC44LjInIGFwcGx5IGZhbHNlIH0K | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg== | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'settings.gradle')"
          echo  | base64 -d > 'settings.gradle'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroBaseball-v4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
