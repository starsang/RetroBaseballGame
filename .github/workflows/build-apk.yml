name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.retrobaseball'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.retrobaseball'
                  minSdk 24
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'EOF_FILE'

          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" android:label="16BIT BASEBALL" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/BaseballView.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/BaseballView.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          
          import android.content.Context;
          import android.graphics.*;
          import android.view.*;
          import java.util.Random;
          
          public class BaseballView extends View {
              Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);
              Paint q=new Paint();
              Random random=new Random();
          
              String myTeam, cpuTeam, msg="PLAY BALL!";
              int inning=1, outs=0, balls=0, strikes=0, myScore=0, cpuScore=0;
              boolean myBat=true, pitchMenu=false, flying=false, gameOver=false;
              float flight=0;
              int pitch=0;
              int W,H;
          
              int grass=Color.rgb(47,145,58), lightGrass=Color.rgb(67,164,68);
              int dirt=Color.rgb(166,88,39), navy=Color.rgb(12,29,55);
              int cream=Color.rgb(245,238,204), yellow=Color.rgb(255,214,58);
          
              public BaseballView(Context c,String a,String b){
                  super(c); myTeam=a; cpuTeam=b; setFocusable(true);
              }
          
              protected void onDraw(Canvas c){
                  W=getWidth(); H=getHeight();
                  drawStadium(c);
                  drawScore(c);
                  drawDiamond(c);
                  drawPlayers(c);
                  if(flying) drawBall(c);
                  if(gameOver) drawGameOver(c); else drawUI(c);
                  postInvalidateDelayed(16);
              }
          
              void drawStadium(Canvas c){
                  c.drawColor(navy);
          
                  // scoreboard
                  rect(c,Color.rgb(5,8,12),0,0,W,92);
                  stroke(c,cream,7,7,W-7,85,3);
                  txt(c,cpuTeam+"  "+cpuScore,18,34,16,cream);
                  txt(c,myTeam+"  "+myScore,W-18-p.measureText(myTeam+"  "+myScore),34,16,cream);
                  txt(c,inning+(myBat?"회 초":"회 말"),W/2-36,30,15,yellow);
                  txt(c,"B "+balls+"   S "+strikes+"   O "+outs,W/2-68,59,14,cream);
          
                  // stadium lights
                  for(int x=18;x<W;x+=70){
                      rect(c,cream,x,103,x+38,109);
                      for(int i=0;i<4;i++) rect(c,yellow,x+4+i*8,110,x+9+i*8,115);
                  }
          
                  // crowd
                  rect(c,Color.rgb(32,38,54),0,122,W,205);
                  for(int y=128;y<200;y+=18){
                      for(int x=4;x<W;x+=22){
                          int col=((x+y)/22)%3==0?Color.rgb(216,54,50):(((x+y)/22)%3==1?Color.rgb(53,94,190):Color.rgb(238,187,54));
                          rect(c,col,x,y,x+12,y+9);
                      }
                  }
          
                  // outfield wall
                  rect(c,Color.rgb(25,91,48),0,205,W,245);
                  txt(c,"HOME RUN",W/2-47,234,14,cream);
          
                  // field
                  rect(c,grass,0,245,W,H);
                  for(int y=260;y<H;y+=32) rect(c,lightGrass,0,y,W,y+15);
          
                  // foul lines/perspective
                  q.setColor(cream); q.setStrokeWidth(5); q.setStyle(Paint.Style.STROKE);
                  Path left=new Path(); left.moveTo(W/2-22,H-92); left.lineTo(25,260);
                  Path right=new Path(); right.moveTo(W/2+22,H-92); right.lineTo(W-25,260);
                  c.drawPath(left,q); c.drawPath(right,q); q.setStyle(Paint.Style.FILL);
          
                  // dirt infield polygon
                  Path in=new Path();
                  in.moveTo(W/2,H-130); in.lineTo(W/2-180,H*0.57f);
                  in.lineTo(W/2,H*0.37f); in.lineTo(W/2+180,H*0.57f); in.close();
                  q.setColor(dirt); c.drawPath(in,q);
          
                  // base paths
                  q.setColor(Color.argb(45,255,255,255)); q.setStrokeWidth(24);
                  c.drawLine(W/2,H-130,W/2-105,H*0.57f,q);
                  c.drawLine(W/2-105,H*0.57f,W/2,H*0.37f,q);
                  c.drawLine(W/2,H*0.37f,W/2+105,H*0.57f,q);
                  c.drawLine(W/2+105,H*0.57f,W/2,H-130,q);
          
                  // grass details
                  for(int x=20;x<W;x+=34) rect(c,Color.argb(35,255,255,255),x,270,x+3,H-110);
              }
          
              void drawScore(Canvas c){
                  rect(c,Color.BLACK,12,102,W-12,120);
                  txt(c,"★ 16-BIT LEAGUE ★",W/2-70,116,12,yellow);
              }
          
              void drawDiamond(Canvas c){
                  float cx=W/2f, homeY=H-125, firstX=cx+105, secondY=H*0.37f, thirdX=cx-105;
                  base(c,cx,homeY); base(c,firstX,H*0.57f); base(c,cx,secondY); base(c,thirdX,H*0.57f);
                  // mound
                  q.setColor(dirt); c.drawOval(cx-55,H*0.40f-22,cx+55,H*0.40f+22,q);
                  rect(c,cream,cx-18,H*0.40f-4,cx+18,H*0.40f+4);
              }
          
              void drawPlayers(Canvas c){
                  drawPlayer(c,W/2f,H*0.40f-38,Color.rgb(48,91,188),false,1.45f);
                  drawPlayer(c,W/2f,H-245,Color.rgb(218,70,43),true,1.75f);
                  // catcher
                  drawPlayer(c,W/2f,H-188,Color.rgb(38,70,150),false,1.05f);
              }
          
              void drawPlayer(Canvas c,float x,float y,int shirt,boolean batter,float s){
                  // shadow
                  q.setColor(Color.argb(75,0,0,0)); c.drawOval(x-34*s,y+54*s,x+34*s,y+68*s,q);
                  // legs
                  rect(c,Color.BLACK,x-26*s,y+25*s,x-5*s,y+65*s);
                  rect(c,Color.BLACK,x+5*s,y+25*s,x+26*s,y+65*s);
                  // torso
                  rect(c,shirt,x-32*s,y-5*s,x+32*s,y+40*s);
                  // arms
                  rect(c,shirt,x-47*s,y+2*s,x-28*s,y+29*s);
                  rect(c,shirt,x+28*s,y+2*s,x+47*s,y+29*s);
                  // neck
                  rect(c,Color.rgb(244,188,140),x-11*s,y+34*s,x+11*s,y+47*s);
                  // head
                  q.setColor(Color.rgb(247,194,143)); c.drawCircle(x,y-25*s,27*s,q);
                  // cap/hair
                  rect(c,Color.BLACK,x-30*s,y-51*s,x+30*s,y-38*s);
                  rect(c,Color.BLACK,x-37*s,y-45*s,x+4*s,y-37*s);
                  // eyes
                  rect(c,Color.BLACK,x-11*s,y-28*s,x-5*s,y-21*s);
                  rect(c,Color.BLACK,x+5*s,y-28*s,x+11*s,y-21*s);
                  // shoes
                  rect(c,Color.BLACK,x-35*s,y+57*s,x-3*s,y+70*s);
                  rect(c,Color.BLACK,x+3*s,y+57*s,x+35*s,y+70*s);
                  if(batter){
                      rect(c,Color.rgb(194,137,62),x+28*s,y-6*s,x+104*s,y+4*s);
                      rect(c,Color.rgb(121,73,31),x+20*s,y-11*s,x+39*s,y+8*s);
                  }
              }
          
              void drawBall(Canvas c){
                  float t=Math.min(1,flight);
                  float ease=t*t*(3-2*t);
                  float startY=H*0.40f-15, endY=H-285;
                  float curve=(pitch==1?62:pitch==2?-48:0);
                  float x=W/2f+curve*(float)Math.sin(t*Math.PI);
                  float y=startY+(endY-startY)*ease;
                  q.setColor(Color.WHITE); c.drawCircle(x,y,9,q);
                  q.setColor(Color.argb(90,255,255,255)); c.drawCircle(x-5,y-5,16,q);
              }
          
              void drawUI(Canvas c){
                  // Raise controls significantly: around 2/3 down, leaving field visible below.
                  float y=H-335;
                  rect(c,Color.argb(215,5,9,13),12,y-42,W-12,y+82);
                  stroke(c,cream,12,y-42,W-12,y+82,3);
          
                  txt(c,msg,W/2-p.measureText(msg)/2,y-17,15,cream);
          
                  if(myBat){
                      button(c,W/2-90,y,W/2+90,y+62,"SWING",yellow);
                      txt(c,"TAP WHEN THE BALL REACHES THE BAT",W/2-123,y+87,10,cream);
                  } else if(pitchMenu){
                      float gap=8, bw=(W-28-gap*2)/3f;
                      button(c,14,y,14+bw,y+58,"FAST",cream);
                      button(c,14+bw+gap,y,14+bw*2+gap,y+58,"CURVE",cream);
                      button(c,14+bw*2+gap*2,y,W-14,y+58,"SLIDER",cream);
                  } else {
                      button(c,W/2-90,y,W/2+90,y+62,"PITCH",yellow);
                      txt(c,"CHOOSE YOUR PITCH",W/2-72,y+87,10,cream);
                  }
          
                  // score/diamond info
                  txt(c,"● "+(myBat?myTeam:cpuTeam),18,H-104,12,yellow);
                  txt(c,"READY",W-62,H-104,11,cream);
              }
          
              void drawGameOver(Canvas c){
                  rect(c,Color.argb(235,0,0,0),0,0,W,H);
                  txt(c,"GAME OVER",W/2-65,H/2-90,27,yellow);
                  String win=myScore==cpuScore?"DRAW GAME":(myScore>cpuScore?myTeam+" WIN!":cpuTeam+" WIN!");
                  txt(c,win,W/2-p.measureText(win)/2,H/2-42,22,cream);
                  txt(c,cpuTeam+" "+cpuScore+"  -  "+myScore+" "+myTeam,W/2-105,H/2,16,cream);
                  button(c,W/2-90,H/2+55,W/2+90,H/2+120,"RESTART",yellow);
              }
          
              void pitchMenu(){ if(!myBat && !flying){ pitchMenu=true; msg="SELECT PITCH"; } }
          
              void throwPitch(int type){
                  if(myBat||flying||gameOver)return;
                  pitch=type; pitchMenu=false; flying=true; flight=0; msg="PITCH...";
              }
          
              void swing(){
                  if(!myBat||gameOver)return;
                  if(!flying){ msg="WAIT FOR PITCH"; return; }
                  if(flight>0.50f && flight<0.84f){
                      int r=random.nextInt(100);
                      if(r<14){myScore+=4;msg="HOME RUN!!!";}
                      else if(r<38){myScore+=2;msg="DOUBLE!";}
                      else if(r<72){myScore+=1;msg="BASE HIT!";}
                      else {outs++;msg="OUT!";}
                  }else{
                      strikes++; msg=flight<0.50f?"TOO EARLY!":"TOO LATE!";
                  }
                  flying=false; nextPlay();
              }
          
              void cpuPlay(){
                  if(myBat||flying||gameOver)return;
                  int r=random.nextInt(100);
                  if(r<15){cpuScore+=4;msg="CPU HOME RUN!";}
                  else if(r<42){cpuScore++;msg="CPU HIT!";}
                  else {outs++;msg="CPU OUT!";}
                  nextPlay();
              }
          
              void nextPlay(){
                  if(strikes>=3){outs++;strikes=0;balls=0;msg="STRIKEOUT!";}
                  if(outs>=3){
                      outs=0;balls=0;strikes=0;
                      if(myBat){
                          myBat=false;msg=cpuTeam+" AT BAT";
                      }else{
                          myBat=true;inning++;msg=myTeam+" AT BAT";
                          if(inning>9 && myScore!=cpuScore) gameOver=true;
                          if(inning>12) gameOver=true;
                      }
                  }
              }
          
              void base(Canvas c,float x,float y){
                  Path b=new Path();b.moveTo(x,y-9);b.lineTo(x+9,y);b.lineTo(x,y+9);b.lineTo(x-9,y);b.close();
                  q.setColor(cream);c.drawPath(b,q);
              }
              void rect(Canvas c,int color,float l,float t,float r,float b){q.setColor(color);c.drawRect(l,t,r,b,q);}
              void stroke(Canvas c,int color,float l,float t,float r,float b,float s){
                  q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(s);q.setColor(color);c.drawRect(l,t,r,b,q);q.setStyle(Paint.Style.FILL);
              }
              void txt(Canvas c,String s,float x,float y,float size,int color){
                  p.setTypeface(Typeface.create(Typeface.MONOSPACE,Typeface.BOLD));p.setTextSize(size);p.setColor(color);c.drawText(s,x,y,p);
              }
              void button(Canvas c,float l,float t,float r,float b,String s,int col){
                  rect(c,Color.rgb(20,24,28),l,t,r,b);stroke(c,col,l,t,r,b,4);
                  p.setTypeface(Typeface.create(Typeface.MONOSPACE,Typeface.BOLD));p.setTextSize(18);
                  txt(c,s,(l+r-p.measureText(s))/2,t+39,18,col);
              }
          
              public boolean onTouchEvent(MotionEvent e){
                  if(e.getAction()!=MotionEvent.ACTION_UP)return true;
                  float x=e.getX(),y=e.getY();
          
                  if(gameOver){
                      if(x>W/2-110&&x<W/2+110&&y>H/2+35&&y<H/2+150)
                          ((MainActivity)getContext()).restart();
                      return true;
                  }
          
                  float by=H-335;
                  if(myBat){
                      if(x>W/2-110&&x<W/2+110&&y>by-20&&y<by+90)swing();
                  }else if(pitchMenu){
                      if(y>by-20&&y<by+90){
                          float bw=(W-44)/3f;
                          if(x<14+bw)throwPitch(0);
                          else if(x<14+bw*2)throwPitch(1);
                          else throwPitch(2);
                      }
                  }else{
                      if(x>W/2-110&&x<W/2+110&&y>by-20&&y<by+90)pitchMenu();
                  }
                  return true;
              }
          
              protected void onSizeChanged(int w,int h,int ow,int oh){W=w;H=h;}
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/MainActivity.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/MainActivity.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          
          import android.app.*;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  teamDialog();
              }
          
              void teamDialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(36, 12, 36, 4);
                  box.setBackgroundColor(Color.rgb(18,18,18));
          
                  TextView title = new TextView(this);
                  title.setText("16BIT BASEBALL\nTEAM SETUP");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(21);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title);
          
                  EditText player = new EditText(this);
                  player.setHint("내 팀 이름");
                  player.setText("RED SOX");
                  player.setTextColor(Color.WHITE);
                  player.setHintTextColor(Color.GRAY);
                  box.addView(player);
          
                  EditText opponent = new EditText(this);
                  opponent.setHint("상대 팀 이름");
                  opponent.setText("BLUE STARS");
                  opponent.setTextColor(Color.WHITE);
                  opponent.setHintTextColor(Color.GRAY);
                  box.addView(opponent);
          
                  new AlertDialog.Builder(this)
                      .setView(box)
                      .setPositiveButton("PLAY BALL", (d,w) -> {
                          String a = player.getText().toString().trim();
                          String c = opponent.getText().toString().trim();
                          if(a.length()==0) a="HOME";
                          if(c.length()==0) c="AWAY";
                          setContentView(new BaseballView(this,a,c));
                      })
                      .setCancelable(false)
                      .show();
              }
          
              public void restart() { teamDialog(); }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">monospace</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RetroBaseballGame"
          include(":app")
          EOF_FILE
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroBaseball-v3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
