name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android { namespace 'com.example.retrobaseball'; compileSdk 35
           defaultConfig { applicationId 'com.example.retrobaseball'; minSdk 24; targetSdk 35; versionCode 5; versionName '5.0' }
           buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
           compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'EOF_FILE'
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme" android:label="16BIT BASEBALL" android:allowBackup="false"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/BaseballView.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/BaseballView.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          import android.content.Context;import android.graphics.*;import android.view.*;import java.util.Random;
          public class BaseballView extends View{
           Paint p=new Paint(3),q=new Paint();Random r=new Random();String me,op,msg="READY";int W,H,viewW,viewH,ox,oy,inn=1,outs=0,strikes=0,meScore=0,opScore=0;boolean batting=true,menu=false,flying=false,gameOver=false,swing=false;float bt=0,st=0;int pitch=0,dir=4;
           int G=Color.rgb(18,165,24),G2=Color.rgb(28,184,32),D=Color.rgb(155,112,22),N=Color.rgb(7,14,32),Y=Color.rgb(255,215,48);
           public BaseballView(Context c,String a,String b){super(c);me=a;op=b;}
           protected void onDraw(Canvas c){viewW=getWidth();viewH=getHeight();int pw=Math.min(viewW,(int)(viewH*0.75f));int ph=Math.min(viewH,(int)(pw/0.75f));ox=(viewW-pw)/2;oy=(viewH-ph)/2;c.drawColor(Color.BLACK);c.save();c.translate(ox,oy);W=pw;H=ph;scene(c);if(flying)ball(c);if(swing)batAnim(c);hud(c);if(gameOver)over(c);c.restore();postInvalidateDelayed(16);}
           void scene(Canvas c){c.drawColor(G);rect(c,N,0,0,W,88);stroke(c,Color.WHITE,5,5,W-5,82,3);txt(c,op+" "+opScore,14,32,15,Color.WHITE);txt(c,me+" "+meScore,W-14-p.measureText(me+" "+meScore),32,15,Color.WHITE);txt(c,inn+"회 "+(batting?"초":"말"),W/2-30,30,15,Y);txt(c,"B 0   S "+strikes+"   O "+outs,W/2-55,58,13,Color.WHITE);
           rect(c,Color.rgb(26,74,42),0,100,W,215);for(int y=110;y<205;y+=20)for(int x=0;x<W;x+=22)rect(c,((x+y)/22%3==0)?Color.rgb(45,88,185):(((x+y)/22%3==1)?Color.rgb(215,50,48):Color.rgb(235,188,45)),x,y,x+12,y+8);rect(c,Color.rgb(20,88,40),0,215,W,244);txt(c,"16-BIT STADIUM",W/2-55,236,13,Color.WHITE);rect(c,G,0,244,W,H);for(int y=260;y<H;y+=36)rect(c,G2,0,y,W,y+16);
           q.setColor(Color.WHITE);q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(5);Path l=new Path();l.moveTo(W/2-22,H-108);l.lineTo(0,300);Path rr=new Path();rr.moveTo(W/2+22,H-108);rr.lineTo(W,300);c.drawPath(l,q);c.drawPath(rr,q);q.setStyle(Paint.Style.FILL);
           float cx=W/2f,hy=H-120,sy=H*.36f,side=H*.57f;Path d=new Path();d.moveTo(cx,hy);d.lineTo(cx-105,side);d.lineTo(cx,sy);d.lineTo(cx+105,side);d.close();q.setColor(D);c.drawPath(d,q);base(c,cx,hy);base(c,cx-105,side);base(c,cx,sy);base(c,cx+105,side);
           player(c,cx,sy+55,Color.rgb(32,72,185),1.3f,false);player(c,cx+145,side-20,Color.rgb(32,72,185),1,false);player(c,cx-135,side-20,Color.rgb(32,72,185),1,false);player(c,cx,275,Color.rgb(32,72,185),1,false);player(c,cx-145,300,Color.rgb(32,72,185),1,false);player(c,cx+145,300,Color.rgb(32,72,185),1,false);
           if(batting){player(c,cx,H-285,Color.rgb(220,66,38),1.8f,true);player(c,cx,H-205,Color.rgb(25,55,145),1.1f,false);}else player(c,cx,H-300,Color.rgb(220,66,38),1.6f,true);
           txt(c,batting?"BATTER VIEW":"PITCHER VIEW",14,H-110,13,Y);}
           void ball(Canvas c){float t=Math.min(1,bt),e=1-(float)Math.pow(1-t,2.15),cx=W/2f;float sy=batting?H*.36f:H-300,ey=batting?H-285:H*.36f;float lateral=(dir%3-1)*62,curve=pitch==1?28:pitch==2?-24:5;float x=cx+lateral*(float)Math.sin(e*Math.PI/2)+curve*(float)Math.sin(e*Math.PI);float y=sy+(ey-sy)*e;float rr=5+12*e;for(int i=5;i>=1;i--){float tt=Math.max(0,t-i*.035f),ee=1-(float)Math.pow(1-tt,2.15);float tx=cx+lateral*(float)Math.sin(ee*Math.PI/2)+curve*(float)Math.sin(ee*Math.PI);float ty=sy+(ey-sy)*ee;q.setColor(Color.argb(16*(6-i),255,255,255));c.drawCircle(tx,ty,rr*.45f,q);}q.setColor(Color.WHITE);c.drawCircle(x,y,rr,q);q.setColor(Color.argb(130,255,255,255));c.drawCircle(x-rr*.25f,y-rr*.25f,rr*.5f,q);}
           void batAnim(Canvas c){float t=Math.min(1,st),cx=W/2f,y=H-285;q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(13);q.setColor(Color.rgb(190,130,55));c.drawArc(cx-110,y-80,cx+110,y+80,-80+t*150,80,false,q);q.setStyle(Paint.Style.FILL);}
           void hud(Canvas c){if(gameOver)return;float y=H-300;rect(c,Color.argb(225,0,0,0),10,y-35,W-10,y+125);stroke(c,Y,10,y-35,W-10,y+125,3);String role=batting?"YOUR TURN — BATTER":"YOUR TURN — PITCHER";txt(c,role,W/2-p.measureText(role)/2,y-10,18,Y);txt(c,msg,W/2-p.measureText(msg)/2,y+15,13,Color.WHITE);
           if(batting){button(c,W/2-105,y+30,W/2+105,y+92,"SWING",Y);txt(c,"공이 도착할 때 누르세요",W/2-82,y+113,11,Color.WHITE);}else if(menu){txt(c,"구종 + 9방향",W/2-48,y+38,12,Color.WHITE);float gx=W/2-72,gy=y+48,s=45;String[] a={"↖","↑","↗","←","●","→","↙","↓","↘"};for(int i=0;i<9;i++){int row=i/3,col=i%3;button(c,gx+col*49,gy+row*49,gx+col*49+s,gy+row*49+s,a[i],i==dir?Y:Color.WHITE);}button(c,15,H-125,110,H-73,"FAST",pitch==0?Y:Color.WHITE);button(c,118,H-125,213,H-73,"CURVE",pitch==1?Y:Color.WHITE);button(c,221,H-125,316,H-73,"SLIDER",pitch==2?Y:Color.WHITE);button(c,W-125,H-125,W-15,H-73,"THROW",Y);}else button(c,W/2-105,y+30,W/2+105,y+92,"PITCH",Y);}
           void over(Canvas c){rect(c,Color.argb(235,0,0,0),0,0,W,H);txt(c,"GAME OVER",W/2-65,H/2-90,27,Y);String s=meScore==opScore?"DRAW":(meScore>opScore?me+" WIN!":op+" WIN!");txt(c,s,W/2-p.measureText(s)/2,H/2-45,22,Color.WHITE);txt(c,op+" "+opScore+" - "+meScore+" "+me,W/2-90,H/2,16,Color.WHITE);button(c,W/2-100,H/2+55,W/2+100,H/2+120,"RESTART",Y);}
           void swingHit(){if(!batting||!flying)return;swing=true;st=0;if(bt>.48&&bt<.86){int n=r.nextInt(100);if(n<12){meScore+=4;msg="HOME RUN!";}else if(n<32){meScore+=2;msg="DOUBLE!";}else if(n<68){meScore++;msg="BASE HIT!";}else{outs++;msg="OUT!";}}else{strikes++;msg=bt<.48?"TOO EARLY!":"TOO LATE!";}flying=false;postDelayed(()->{swing=false;next();},280);}
           void next(){if(strikes>=3){outs++;strikes=0;msg="STRIKEOUT!";}if(outs>=3){outs=0;strikes=0;batting=!batting;if(!batting)msg=op+" AT BAT";else{inn++;msg=me+" AT BAT";}if(inn>9&&meScore!=opScore)gameOver=true;if(inn>12)gameOver=true;}}
           void pitchStart(){if(batting||gameOver)return;flying=true;bt=0;menu=false;msg=pitch==0?"FASTBALL!":pitch==1?"CURVE!":"SLIDER!";}
           void cpuPitch(){if(!batting||flying||gameOver)return;flying=true;bt=0;msg="PITCH COMING!";}
           public boolean onTouchEvent(MotionEvent e){if(e.getAction()!=MotionEvent.ACTION_UP)return true;float x=e.getX()-ox,y=e.getY()-oy;if(gameOver){if(x>W/2-120&&x<W/2+120&&y>H/2+35&&y<H/2+150)((MainActivity)getContext()).restart();return true;}if(batting){if(!flying&&y>H-335&&y<H-165)cpuPitch();else if(flying&&y>H-335&&y<H-165)swingHit();}else if(!menu&&y>H-335&&y<H-165){menu=true;msg="SELECT PITCH";}else if(menu){float gx=W/2-72,gy=H-252,s=45;for(int i=0;i<9;i++){int row=i/3,col=i%3;float l=gx+col*49,t=gy+row*49;if(x>=l&&x<=l+s&&y>=t&&y<=t+s){dir=i;msg="DIRECTION "+(i+1);return true;}}if(y>H-125&&y<H-73){if(x<110)pitch=0;else if(x<213)pitch=1;else if(x<316)pitch=2;else if(x>W-140)pitchStart();} }return true;}
           void player(Canvas c,float x,float y,int shirt,float s,boolean bat){q.setColor(Color.argb(80,0,0,0));c.drawOval(x-30*s,y+48*s,x+30*s,y+61*s,q);rect(c,Color.BLACK,x-23*s,y+24*s,x-5*s,y+60*s);rect(c,Color.BLACK,x+5*s,y+24*s,x+23*s,y+60*s);rect(c,shirt,x-29*s,y-2*s,x+29*s,y+38*s);rect(c,shirt,x-43*s,y+2*s,x-27*s,y+27*s);rect(c,shirt,x+27*s,y+2*s,x+43*s,y+27*s);q.setColor(Color.rgb(248,194,140));c.drawCircle(x,y-25*s,26*s,q);rect(c,Color.BLACK,x-29*s,y-50*s,x+29*s,y-38*s);rect(c,Color.BLACK,x-10*s,y-28*s,x-5*s,y-22*s);rect(c,Color.BLACK,x+5*s,y-28*s,x+10*s,y-22*s);if(bat)rect(c,Color.rgb(190,132,53),x+28*s,y-7*s,x+100*s,y+4*s);}
           void base(Canvas c,float x,float y){Path b=new Path();b.moveTo(x,y-9);b.lineTo(x+9,y);b.lineTo(x,y+9);b.lineTo(x-9,y);b.close();q.setColor(Color.WHITE);c.drawPath(b,q);}
           void rect(Canvas c,int color,float l,float t,float rr,float b){q.setColor(color);c.drawRect(l,t,rr,b,q);}void stroke(Canvas c,int color,float l,float t,float rr,float b,float s){q.setColor(color);q.setStyle(Paint.Style.STROKE);q.setStrokeWidth(s);c.drawRect(l,t,rr,b,q);q.setStyle(Paint.Style.FILL);}void txt(Canvas c,String s,float x,float y,float z,int col){p.setTypeface(Typeface.create(Typeface.MONOSPACE,Typeface.BOLD));p.setTextSize(z);p.setColor(col);c.drawText(s,x,y,p);}void button(Canvas c,float l,float t,float rr,float b,String s,int col){rect(c,Color.rgb(8,12,18),l,t,rr,b);stroke(c,col,l,t,rr,b,4);p.setTextSize(17);txt(c,s,(l+rr-p.measureText(s))/2,t+(b-t)/2+6,17,col);}
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/java/com/example/retrobaseball/MainActivity.java')"
          cat > 'app/src/main/java/com/example/retrobaseball/MainActivity.java' <<'EOF_FILE'
          package com.example.retrobaseball;
          import android.app.*;import android.os.*;import android.graphics.Color;import android.view.*;import android.widget.*;
          public class MainActivity extends Activity{
           public void onCreate(Bundle b){super.onCreate(b);requestWindowFeature(Window.FEATURE_NO_TITLE);getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,WindowManager.LayoutParams.FLAG_FULLSCREEN);setup();}
           void setup(){LinearLayout x=new LinearLayout(this);x.setOrientation(LinearLayout.VERTICAL);x.setPadding(32,10,32,4);x.setBackgroundColor(Color.rgb(12,15,22));TextView t=new TextView(this);t.setText("16BIT BASEBALL\nTEAM SETUP");t.setTextColor(Color.WHITE);t.setTextSize(21);t.setGravity(17);x.addView(t);EditText a=new EditText(this);a.setText("RED SOX");a.setTextColor(Color.WHITE);a.setHint("내 팀");x.addView(a);EditText b=new EditText(this);b.setText("BLUE STARS");b.setTextColor(Color.WHITE);b.setHint("상대 팀");x.addView(b);new AlertDialog.Builder(this).setView(x).setPositiveButton("PLAY BALL",(d,w)->{String s=a.getText().toString().trim(),e=b.getText().toString().trim();if(s.isEmpty())s="HOME";if(e.isEmpty())e="AWAY";setContentView(new BaseballView(this,s,e));}).setCancelable(false).show();}
           public void restart(){setup();}
          }
          EOF_FILE
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'EOF_FILE'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">monospace</item><item name="android:windowFullscreen">true</item><item name="android:navigationBarColor">#000000</item></style></resources>
          EOF_FILE
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.8.2' apply false }
          EOF_FILE
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_FILE
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='RetroBaseballGame'
          include ':app'
          EOF_FILE
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroBaseball-v5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
